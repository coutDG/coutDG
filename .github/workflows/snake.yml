name: Generate Aizen Snake

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
  repository_dispatch:
    types: [update-graph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/aizen-snake.svg?palette=github-dark&color_snake=#ffffff&color_dots=#3a2c6b,#5a43b5,#7c4dff,#a78bfa,#e0d4ff

      - name: Add purple background
        run: |
          sed -i '0,/<svg[^>]*>/s//&<rect width="100%" height="100%" fill="#1a1033"\/>/' dist/aizen-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
