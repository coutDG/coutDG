name: Ping profile

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROFILE_PAT }}" \
            https://api.github.com/repos/coutDG/coutDG/dispatches \
            -d '{"event_type":"update-graph"}'
